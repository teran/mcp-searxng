name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Bind to the standard build-system interface (R07): `make build` runs
      # goreleaser, producing the single binary artifact in dist/ (B01/B02/B04).
      - name: Build + release (goreleaser via make)
        run: make build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: docker_tags
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORTCOMMIT=$(git rev-parse --short HEAD)
          echo "tags=${VERSION},${VERSION}-${TIMESTAMP},${VERSION}-${SHORTCOMMIT},${VERSION}-${SHORTCOMMIT}-${TIMESTAMP},latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build + push the image from the `make build` artifact (B04) via the
      # make interface (R07). IMAGE_TAGS carries the computed R03 tag scheme.
      - name: Build and push Docker image
        run: make container-image push=true IMAGE_TAGS="${{ steps.docker_tags.outputs.tags }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
