name: gremlins

# Mutation testing (C02/C08GO) as a HARD gate: the build FAILS when mutation
# efficacy or mutant coverage drop below 80/80. The action runs gremlins once
# per target package, each of which must meet the thresholds.
on:
  pull_request:

jobs:
  gremlins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
      - uses: go-gremlins/gremlins-action@v1
        with:
          version: latest
          args: >-
            --threshold-efficacy=80
            --threshold-mcover=80
            --workers 1
            --timeout-coefficient 10
            handlers application infrastructure/searxng config
          workdir: .
