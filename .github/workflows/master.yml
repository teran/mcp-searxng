name: Master

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      # Bind to the standard build-system interface (R07): `make build` runs
      # goreleaser, producing the single binary artifact in dist/ (B01/B02/B04).
      - name: Build (goreleaser via make)
        run: make build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORTCOMMIT=$(git rev-parse --short HEAD)
          echo "tags=master-${SHORTCOMMIT},master-${TIMESTAMP},master-${SHORTCOMMIT}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build + push the image from the `make build` artifact (B04) via the
      # make interface (R07). IMAGE_TAGS carries the computed R04 tag scheme.
      - name: Build and push Docker image
        run: make container-image push=true IMAGE_TAGS="${{ steps.meta.outputs.tags }},master"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
