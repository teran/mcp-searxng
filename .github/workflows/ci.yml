name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      # Lint + gosec via the official golangci-lint action (findings must be
      # FIXED). Pinned to the local toolchain version (v2.13.2) so the v2 config
      # schema cannot drift between CI and local runs.
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --config .golangci.yml

      # govulncheck — dependency-graph vulnerability scan; findings must be FIXED.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # go-arch-lint — enforce DDD/Clean layer edges (C07GO).
      - name: go-arch-lint
        run: |
          go install github.com/fe3dback/go-arch-lint@latest
          go-arch-lint check

      # Unit tests with the race detector + >= 95% coverage gate (C01/C04GO).
      - name: Test
        run: make test

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cover.out
          retention-days: 7
