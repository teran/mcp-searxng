name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      # Lint — bind to the standard build-system interface (R07/N31): `make
      # lint` runs golangci-lint (strict set incl. gosec) + standalone gosec
      # (v2.30.0, compatible with the pinned Go 1.27.3) + go vet + govulncheck
      # + go-arch-lint. Findings must be FIXED, not suppressed (S05).
      - name: Install lint tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          # v1.19.1 supports the `.go-arch-lint.yml` `version: 3` schema (the
          # current documented format) — pinned here.
          go install github.com/fe3dback/go-arch-lint@v1.19.1

      - name: Lint (make lint)
        run: make lint

      # Unit tests with the race detector + >= 95% coverage gate (C01/C04GO).
      - name: Test
        run: make test

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cover.out
          retention-days: 7

  # e2e — full tool-handler → live SearXNG path (C04/T02/C09GO) via the
  # go-docker-testsuite harness (`make e2e`). Requires a Docker daemon.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: e2e (make e2e)
        run: make e2e
