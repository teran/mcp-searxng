name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # Lint + gosec (via golangci-lint) + govulncheck — findings must be FIXED.
      - name: Lint
        run: make lint

      # Unit tests with the race detector + >= 95% coverage gate (C01/C04GO).
      - name: Test
        run: make test

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cover.out
          retention-days: 7
