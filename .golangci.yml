# golangci-lint v2 configuration for a Go MCP server (C03GO).
# Docs: https://golangci-lint.run/
#
# Run locally:  golangci-lint run ./...
# Run in CI:    via `make lint` (templates/ci/{provider}).
#
# This is a STRICT linter set — a requirement for generated servers. It is the
# fleet-standard config. Keep the `enable` set in sync with
# `reference/criteria/go.md` (C03GO) and the conformance checklist. Findings
# must be FIXED, not suppressed (S05) — this is not a blanket default exclude.
version: "2"

run:
  timeout: 10m

linters:
  # `standard` = the golangci-lint v2 default set; the extra `enable` list is
  # the strict tier added on top (both together are the C03GO requirement).
  # `gosec` (security, C05GO) is enabled at v2.30.0 — compatible with the
  # pinned Go 1.27.3 toolchain (see `reference/versions.md`).
  default: standard
  enable:
    - gosec
    - revive
    - unconvert
    - whitespace
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - decorder
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - goprintffuncname
    - govet
    - grouper
    - iface
    - importas
    - ineffassign
    - intrange
    - iotamixing
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nestif
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - modernize
    - ireturn
    - interfacebloat
    - godot
    - dupword
    - nakedret
    - lll
    - funlen
    - mnd
    - nlreturn
    - varnamelen
    - godoclint
    - containedctx
    - forcetypeassert
    - nilerr
    - errorlint
    - exhaustive
  settings:
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - anon
        # MCP servers legitimately return the SDK transport interface.
        - ^github\.com/modelcontextprotocol/go-sdk/mcp\.Transport$
        # ParseFormat returns a logrus formatter interface.
        - ^github\.com/sirupsen/logrus\.Formatter$
    nakedret:
      max-func-lines: 30
    lll:
      line-length: 130
    funlen:
      lines: 60
      statements: 40
    varnamelen:
      # AI-generated Go code uses short idiomatic names (table-test vars,
      # logger/event/repo receivers). Scope the linter to genuinely unclear
      # long-scope names: flag nothing below 3 chars, never complain about
      # return values, allowlist the idiomatic short identifiers below.
      min-name-length: 3
      check-return: false
      ignore-names:
        - ctx
        - id
        - ok
        - err
        - t
        - tt
        - w
        - wg
        - fd
        - db
        - ch
        - in
        - out
        - mu
        - b
        - i
        - j
        - k
        - n
        - m
        - x
        - y
        - c
        - d
        - e
        - v
        - s
        - p
        - r
        - f
        - o
        - a
        - g
        - l
        - h
    godoclint:
      # AI-generated code has extensive godoc; the only common noise is
      # `single-pkg-doc` flagging the conventional pattern of a package comment
      # in every file of a package. Keep the value-adding rules (require-doc,
      # start-with-name, max-len, no-unused-link, deprecated,
      # require-stdlib-doclink) and disable that one via config, not mass edits.
      disable:
        - single-pkg-doc
    exhaustive:
      # An exhaustive switch that deliberately funnels many kinds through a
      # single `default` (which genuinely terminates) is accepted.
      default-signifies-exhaustive: true
  exclusions:
    rules:
      # Test code may ignore errors in setup/cleanup helpers without noise.
      # Production (non-test) findings must still be FIXED, never suppressed.
      - path: _test\.go
        linters:
          - errcheck
          - govet

formatters:
  enable:
    - gofmt
    - gofumpt
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  whole-files: true
  fix: false

output:
  formats:
    text:
      path: stderr
      print-linter-name: true
      print-issued-lines: true
      colors: false
  sort-order:
    - linter
    - severity
    - file
  show-stats: true

severity:
  default: error
