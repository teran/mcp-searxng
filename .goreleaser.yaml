version: 2

project_name: mcp-searxng

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    binary: mcp-searxng

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - SPEC.md
      - AGENTS.md

checksum:
  name_template: "checksums.txt"

snapshot:
  # Non-tag / master builds must embed a SNAPSHOT version (B02/N43):
  # {X}-SNAPSHOT-{commit}. The embedded appVersion then reflects the dev state
  # rather than looking like a stable release.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: teran
    name: mcp-searxng
  draft: false
