# go-arch-lint dependency rules (C07GO) for mcp-searxng.
# Docs: https://github.com/fe3dback/go-arch-lint
#
# The Go layout is ALWAYS layered (DDD/Clean, A01): cmd/ + domain/ +
# application/ + infrastructure/. Top-level named packages are the DEFAULT
# (no `internal/` wrapper is used). These rules encode the layer edges.
#
# Actual package layout and dependency edges:
#   cmd/server (composition root) -> application, config, handlers, infrastructure
#   handlers (HTTP/MCP layer)     -> application, domain
#   application (use cases)       -> domain
#   infrastructure/searxng        -> domain (implements domain ports)
#   domain                        -> (nothing; innermost)
#   config                        -> (nothing internal)
#
# Every other edge (e.g. application -> infrastructure, domain -> application,
# handlers -> infrastructure) is forbidden.
#
# Run locally:  go-arch-lint check
# Run in CI:    via `make lint` / a dedicated CI job (C07GO)

version: 3

# Global scheme options. deepScan (AST method-call/injection tracing) is on by
# default in v3+ and flags the legitimate dependency-injection wiring in the
# composition root (cmd injects the infrastructure adapter into the application
# service through a domain port). The base import linter already enforces the
# layer edges (infrastructure imports only domain), so disable deepScan.
allow:
  deepScan: false

components:
  cmd:
    in: cmd/**
  handlers:
    in: handlers
  application:
    in: application
  infrastructure:
    in: infrastructure/**
  domain:
    in: domain
  config:
    in: config
  logging:
    in: logging
  requestid:
    in: requestid
  e2e:
    in: e2e

deps:
  # cmd is the composition root; it wires application + infrastructure +
  # handlers + config.
  cmd:
    mayDependOn:
      - application
      - infrastructure
      - handlers
      - config
      - logging
    anyVendorDeps: true

  # handlers is the HTTP/MCP presentation layer; uses application + domain.
  handlers:
    mayDependOn:
      - application
      - domain
      - requestid
    anyVendorDeps: true

  # application uses domain.
  application:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # infrastructure implements domain ports; forwards the correlation id.
  infrastructure:
    mayDependOn:
      - domain
      - requestid
    anyVendorDeps: true

  # domain is the innermost layer — no outward internal deps (stdlib only).
  domain:
    anyVendorDeps: true

  # config is a leaf — no internal deps (uses envconfig/ozzo-validation).
  config:
    mayDependOn:
      - logging
    anyVendorDeps: true

  # logging is a leaf utility — no internal deps (uses logrus/stdlib).
  logging:
    anyVendorDeps: true

  # requestid is a leaf utility — no internal deps (stdlib only).
  requestid:
    anyVendorDeps: true

  # e2e is a build-tagged test-harness package (//go:build e2e, excluded from the
  # default unit pass). It exercises the full tool-handler -> SearXNG path, so it
  # may import the layers it drives (application/domain/infrastructure) plus its
  # vendor harness (go-docker-testsuite, resty).
  e2e:
    mayDependOn:
      - application
      - domain
      - infrastructure
    anyVendorDeps: true

# Directories excluded from dependency analysis (generated code, vendored deps).
exclude:
  - ./vendor
  - ./generated

# Test files are excluded from architecture analysis (a package's external
# test file legitimately imports the package under test).
excludeFiles:
  - "_test.go$"

